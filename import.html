<!DOCTYPE html>
<html lang="id">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>GeoCam PRO — Import Template</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
 <style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background-color: #0F172A; color: #FFFFFF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; }

  /* Brand Header */
  .brand-logo { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #FF6B00, #F59E0B); display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(255, 107, 0, 0.35); }
  .brand-title { font-size: 22px; font-weight: 800; color: #FFFFFF; margin-bottom: 8px; }
  .brand-sub { font-size: 13px; color: #94A3B8; font-weight: 500; max-width: 290px; margin: 0 auto 28px; line-height: 1.5; }

  /* Card Preview Container */
  .card-box { background: #1E293B; border: 1px solid #334155; border-radius: 24px; padding: 24px 20px; width: 100%; max-width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); margin-bottom: 28px; position: relative; overflow: hidden; }
  .card-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #FF6B00, #007AFF); }

  .card-label { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .code-display { font-size: 24px; font-weight: 900; color: #38BDF8; font-family: monospace; letter-spacing: 2px; background: #0F172A; padding: 12px 16px; border-radius: 12px; border: 1px solid #334155; display: inline-block; margin-bottom: 12px; word-break: break-all; }
  .author-info { font-size: 12px; color: #94A3B8; font-weight: 600; }

  /* Big Blue Button (Sesuai Timemark) */
  .btn-pakai { width: 100%; max-width: 320px; background: #007AFF; color: #FFFFFF; text-decoration: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4); transition: transform 0.15s, background-color 0.15s; }
  .btn-pakai:active { transform: scale(0.98); background: #0062CC; }

  .footer-note { font-size: 11px; color: #64748B; margin-top: 24px; font-weight: 500; }
 </style>
</head>
<body>

 <div class="brand-logo">
  <i class="fa-solid fa-camera"></i>
 </div>

 <h1 class="brand-title">Anda mendapatkan template baru 🌟</h1>
 <p class="brand-sub">Gunakan templat yang sama untuk mengambil foto kerja profesional.</p>

 <div class="card-box">
  <div class="card-label">Kode Template Watermark</div>
  <div class="code-display" id="codeText">GCTMPL-PRO</div>
  <div class="author-info" id="authorText">Dibuat untuk GeoCam PRO</div>
 </div>

 <!-- Tombol Biru Besar (Pakai Sekarang - Sesuai Contoh Timemark) -->
 <a href="#" id="btnPakaiSekarang" class="btn-pakai">
  <i class="fa-solid fa-cloud-arrow-down"></i> Pakai sekarang
 </a>

 <p class="footer-note">Aplikasi GeoCam PRO akan langsung terbuka secara otomatis.</p>

 <script>
  function getQueryParam(param) {
   var urlParams = new URLSearchParams(window.location.search);
   return urlParams.get(param) || '';
  }

  var code = getQueryParam('code') || getQueryParam('c') || 'GCTMPL-PRO';
  document.getElementById('codeText').textContent = code.toUpperCase();

  // Intent Link untuk Memaksa Android Membuka Aplikasi GeoCam PRO Langsung!
  var intentUri = "intent://import?code=" + encodeURIComponent(code) + "#Intent;scheme=geocam;package=com.kamera.geoprotime;end";
  var btn = document.getElementById('btnPakaiSekarang');
  btn.href = intentUri;

  // Otomatis Alihkan / Pemicu Buka Aplikasi Saat Halaman Dibuka!
  setTimeout(function() {
   window.location.href = intentUri;
  }, 400);
 </script>
</body>
</html>
